<div id="flag-status">Loading flag status…</div>

<script>
(async () => {
  const res = await fetch("./status.json", { cache: "no-store" });
  const data = await res.json();

  const us = data.us;
  const fl = data.florida;

  function formatDates(start, end) {
    if (!start && !end) return "";
    if (start && end && start === end) return ` (${start})`;
    if (start && end) return ` (${start} → ${end})`;
    return "";
  }

  let html = `<strong>US FLAG:</strong> ${us.status}`;
  if (us.status === "HALF STAFF") {
    if (us.reason) html += `<br><strong>Reason:</strong> ${us.reason}`;
    html += formatDates(us.start, us.end);
  }

  html += `<hr style="border:0;border-top:1px solid #ccc;margin:10px 0;">`;

  html += `<strong>FL FLAG:</strong> ${fl.status}`;
  if (fl.status === "HALF STAFF") {
    if (fl.reason) html += `<br><strong>Reason:</strong> ${fl.reason}`;
    html += formatDates(fl.start, fl.end);
  }

  document.getElementById("flag-status").innerHTML = html;
})();
</script>
