<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flag Status</title>

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: transparent;
      color: #000;
    }

    /* ===== FLAG STATUS (VERY LARGE) ===== */
    .flag-line {
      font-size: 105px;      /* STATUS SIZE */
      font-weight: 800;
      line-height: 1.15;
    }

    /* ===== REASON + DATE ===== */
    .flag-detail {
      font-size: 60px;       /* REASON / DATE SIZE */
      font-weight: 600;
      line-height: 1.25;
      margin-left: 6px;
    }

    hr {
      border: 0;
      border-top: 4px solid #ccc;
      margin: 24px 0;
    }

    /* ===== FOOTER ===== */
    #last-updated {
      margin-top: 20px;
      text-align: center;
      color: #fff;
      font-size: 50px;       /* LAST UPDATED SIZE */
      font-weight: 600;
    }
  </style>
</head>

<body>

<div id="flag-status">Loading flag status…</div>
<div id="last-updated"></div>

<script>
(async () => {
  const res = await fetch("./status.json", { cache: "no-store" });
  const data = await res.json();

  const us = data.us || { status: "UNKNOWN" };
  const fl = data.florida || { status: "UNKNOWN" };
  const updated = data.updated || null;

  function formatDates(start, end) {
    if (!start && !end) return "";
    if (start && end && start === end) {
      return `<div class="flag-detail">Date: ${start}</div>`;
    }
    if (start && end) {
      return `<div class="flag-detail">Dates: ${start} → ${end}</div>`;
    }
    if (start) return `<div class="flag-detail">Starts: ${start}</div>`;
    if (end) return `<div class="flag-detail">Ends: ${end}</div>`;
    return "";
  }

  function render(label, obj) {
    let html = `<div class="flag-line">${label}: ${obj.status}</div>`;

    if (obj.status === "HALF STAFF") {
      if (obj.reason) {
        html += `<div class="flag-detail">Reason: ${obj.reason}</div>`;
      }
      html += formatDates(obj.start, obj.end);
    }

    return html;
  }

  document.getElementById("flag-status").innerHTML =
    render("US FLAG", us) +
    `<hr>` +
    render("FL FLAG", fl);

  if (updated) {
    const d = new Date(updated);
    document.getElementById("last-updated").textContent =
      `Last updated: ${d.toLocaleString()}`;
  }
})();
</script>

</body>
</html>
