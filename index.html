<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flag Status</title>

  <style>
    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, Helvetica, sans-serif;
      background: transparent;
    }

    /* MAIN DISPLAY */
    #flag-status {
      line-height: 1.3;

      /* 🔥 EXTRA LARGE RESPONSIVE TEXT 🔥 */
      font-size: clamp(28px, 7vw, 64px);
    }

    #flag-status strong {
      font-weight: 800;
    }

    #flag-status hr {
      border: 0;
      border-top: 3px solid #ccc;
      margin: 0.5em 0;
    }

    /* FOOTER */
    #last-updated {
      margin-top: 10px;
      text-align: center;
      color: #666;

      /* smaller, subtle text */
      font-size: clamp(12px, 1.6vw, 18px);
    }
  </style>
</head>

<body>

<div id="flag-status">Loading flag status…</div>
<div id="last-updated"></div>

<script>
(async () => {
  const res = await fetch("./status.json", { cache: "no-store" });
  const data = await res.json();

  const us = data.us || { status: "UNKNOWN" };
  const fl = data.florida || { status: "UNKNOWN" };
  const updated = data.updated || null;

  function formatDates(start, end) {
    if (!start && !end) return "";
    if (start && end && start === end) {
      return `<br><strong>Date:</strong> ${start}`;
    }
    if (start && end) {
      return `<br><strong>Dates:</strong> ${start} → ${end}`;
    }
    if (start) return `<br><strong>Starts:</strong> ${start}`;
    if (end) return `<br><strong>Ends:</strong> ${end}`;
    return "";
  }

  function render(label, obj) {
    let html = `<strong>${label}:</strong> ${obj.status}`;

    if (obj.status === "HALF STAFF") {
      if (obj.reason) {
        html += `<br><strong>Reason:</strong> ${obj.reason}`;
      }
      html += formatDates(obj.start, obj.end);
    }

    return html;
  }

  document.getElementById("flag-status").innerHTML =
    render("US FLAG", us) +
    `<hr>` +
    render("FL FLAG", fl);

  if (updated) {
    const d = new Date(updated);
    document.getElementById("last-updated").textContent =
      `Last updated: ${d.toLocaleString()}`;
  }
})();
</script>

</body>
</html>
